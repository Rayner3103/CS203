services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    image: raynersim/backend:v1.0
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Full origin of the frontend, used for CORS. Local dev over http.
      - FRONTEND_ORIGIN=http://localhost:${FRONTEND_PORT}
      # Local dev is http, so a plain (Lax, non-secure) cookie works.
      - COOKIE_SECURE=false
      - COOKIE_SAMESITE=Lax
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_EXP_TIME=${JWT_EXP_TIME}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* values are baked at build time. The browser (on the host) reaches
        # the backend via the published host port, so use localhost:${BACKEND_PORT}.
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:${BACKEND_PORT}
    image: raynersim/frontend:v1.0
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:${BACKEND_PORT}
    depends_on:
      - backend

volumes:
  postgres_data: