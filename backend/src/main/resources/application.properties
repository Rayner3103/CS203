spring.application.name=backend

spring.docker.compose.enabled=false

# Bind to the port the platform injects (Render sets $PORT); default 8080 for local/dev.
server.port=${PORT:8080}

# detect .env without cicd, comment if using CICD 
# spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.error.include-message=always

# Security configuration stuffs
security.password.min-length=8
security.password.max-length=16

# Auth cookie attributes.
# Local/dev (http): secure=false, same-site=Lax.
# Cross-site prod (Vercel frontend -> Render backend, both https): secure=true, same-site=None.
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAMESITE:Lax}

# Allowed CORS origin(s) for the frontend. Comma-separated; supports patterns like https://*.vercel.app.
app.frontend.origins=${FRONTEND_ORIGIN:http://localhost:3000}

# File upload limits (increase if clients upload larger PDFs)
# Set these as needed. Default is typically 1MB in many environments.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
